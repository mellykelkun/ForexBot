<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForexBot SaaS — Accès</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 50%, #0d1117 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
        }
        .login-container {
            background: rgba(20, 25, 45, 0.95);
            border: 1px solid rgba(100, 120, 255, 0.2);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(100, 120, 255, 0.05);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #6478ff, #00d4aa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .logo p {
            font-size: 13px;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 120, 255, 0.25);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            letter-spacing: 2px;
            transition: all 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6478ff;
            box-shadow: 0 0 0 3px rgba(100, 120, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        .form-group input::placeholder {
            color: #555;
            letter-spacing: 1px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6478ff, #4a5ce6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #7a8cff, #5a6cf0);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(100, 120, 255, 0.3);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .error-msg {
            background: rgba(255, 60, 60, 0.1);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ff6b6b;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .security-note {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #555;
        }
        .security-note span {
            color: #00d4aa;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ForexBot SaaS</h1>
            <p>Trading Dashboard</p>
        </div>

        {% if error %}
        <div class="error-msg show">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="off">
            <div class="form-group">
                <label for="access_key">Clé d'accès</label>
                <input
                    type="password"
                    id="access_key"
                    name="access_key"
                    placeholder="Entrez votre clé d'accès"
                    required
                    autofocus
                    autocomplete="off"
                />
            </div>
            <button type="submit" class="submit-btn">Accéder au Dashboard</button>
        </form>

        <div class="security-note">
            🔒 Connexion sécurisée — <span>SHA-256 + HMAC</span>
        </div>
    </div>
</body>
</html>
